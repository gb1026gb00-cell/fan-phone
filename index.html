<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>팬메이드 폰 시뮬레이터</title><style>
:root{font-family:system-ui,-apple-system,sans-serif;color:#24222b}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:linear-gradient(145deg,#e7d9ff,#ffebd7);display:grid;place-items:center}.phone{width:min(390px,100vw);height:min(780px,100dvh);background:#faf8ff;border:8px solid #282530;border-radius:38px;overflow:hidden;position:relative;box-shadow:0 15px 50px #30273d44}.status{height:35px;padding:10px 22px;font-size:12px;font-weight:700;display:flex;justify-content:space-between}.screen{height:calc(100% - 35px);overflow:auto;padding:18px}.hidden{display:none!important}.lock{display:flex;flex-direction:column;justify-content:center;align-items:center;gap:15px;background:linear-gradient(150deg,#d7b8fa,#ffe4cc)}h1{font-size:25px;margin:8px 0}h2{font-size:20px}p{line-height:1.5}.lock .clock{font-size:62px;font-weight:300}.pin{font-size:19px;letter-spacing:7px;width:190px;text-align:center;padding:12px;border:0;border-radius:14px}button{font:inherit;border:0;cursor:pointer;border-radius:14px;padding:12px;background:#eee7ff;color:#28213d}button:focus-visible{outline:3px solid #7255e6}.primary{background:#7355d6;color:white}.apps{display:grid;grid-template-columns:repeat(3,1fr);gap:20px;margin-top:40px}.app{display:flex;flex-direction:column;align-items:center;gap:8px;background:transparent}.app b{font-size:28px;background:white;border-radius:20px;padding:16px;box-shadow:0 3px 15px #2a224020}.app span{font-size:13px}.top{display:flex;align-items:center;gap:12px;margin-bottom:18px}.top button{padding:8px 12px}.thread{display:flex;flex-direction:column;gap:12px}.bubble{padding:12px 15px;background:#e8e0ff;border-radius:18px;max-width:83%;align-self:flex-start}.mine{background:#ffe1a6;align-self:flex-end}.item{display:block;width:100%;text-align:left;background:white;margin-bottom:10px;padding:16px}.composer{display:flex;gap:8px;position:sticky;bottom:0;background:#faf8ff;padding:12px 0}.composer input{min-width:0;flex:1;padding:12px;border:1px solid #ddd;border-radius:12px}.gallery{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.photo{min-height:140px;display:grid;place-items:center;text-align:center;background:linear-gradient(140deg,#ffdacb,#cdbcfb);border-radius:18px;padding:12px}.note{background:#fff1c9;padding:18px;border-radius:15px}.hint{font-size:12px;color:#60596c}.notice{font-size:12px;text-align:center;padding:12px;color:#51445e}
</style></head><body><main class="phone"><div class="status"><span>9:41</span><span>●●● ▰</span></div><section id="lock" class="screen lock"><div class="clock">09:41</div><p>비밀 휴대폰에 오신 걸 환영해요</p><input id="pin" class="pin" type="password" inputmode="numeric" maxlength="4" placeholder="비밀번호" aria-label="비밀번호"><button class="primary" onclick="unlock()">잠금 해제</button><div id="error" class="hint"></div><div class="hint">체험 비밀번호: 1234</div></section><section id="home" class="screen hidden"><h1>안녕하세요 ☀️</h1><p>오늘은 어떤 비밀을 발견할까요?</p><div class="apps"><button class="app" onclick="show('messages')"><b>💬</b><span>메시지</span></button><button class="app" onclick="show('photos')"><b>🖼️</b><span>사진첩</span></button><button class="app" onclick="show('notes')"><b>📝</b><span>메모</span></button></div><p class="notice">비공식 창작 팬메이드 체험 사이트 · 실제 인물과 무관한 가상 대화</p></section><section id="messages" class="screen hidden"><div class="top"><button onclick="show('home')">‹ 홈</button><h2>메시지</h2></div><button class="item" onclick="show('chat')">💜 하늘이<br><span class="hint">오늘 뭐해? ㅋㅋ</span></button></section><section id="chat" class="screen hidden"><div class="top"><button onclick="show('messages')">‹ 목록</button><h2>하늘이</h2></div><div id="thread" class="thread" aria-live="polite"><div class="bubble">오늘 뭐해? ㅋㅋ</div><div class="bubble">나 심심한데</div></div><form class="composer" onsubmit="reply(event)"><input id="msg" placeholder="메시지 입력" aria-label="메시지"><button class="primary">전송</button></form><p class="hint">현재는 미리 설정된 자동 응답입니다. AI 연결은 다음 단계에서 진행합니다.</p></section><section id="photos" class="screen hidden"><div class="top"><button onclick="show('home')">‹ 홈</button><h2>사진첩</h2></div><div class="gallery"><div class="photo">🌅<br>함께 본 노을</div><div class="photo">☕<br>카페에서</div><div class="photo">🌊<br>여름 바다</div><div class="photo">🌙<br>밤 산책</div></div></section><section id="notes" class="screen hidden"><div class="top"><button onclick="show('home')">‹ 홈</button><h2>메모</h2></div><div class="note">잊지 말 것.<br><br>그날의 약속은 아직 유효하다.</div></section></main><script>
function show(id){document.querySelectorAll('.screen').forEach(el=>el.classList.add('hidden'));document.getElementById(id).classList.remove('hidden')}
function unlock(){if(document.getElementById('pin').value==='1234'){show('home')}else{document.getElementById('error').textContent='비밀번호가 달라요.'}}
function reply(e){e.preventDefault();const input=document.getElementById('msg');const value=input.value.trim();if(!value)return;add(value,true);input.value='';add(value.includes('뭐해')?'너 기다리고 있었지 ㅋㅋ':value.includes('안녕')?'안녕!! 오늘 하루 어땠어?':'ㅋㅋㅋㅋ 진짜? 더 얘기해 줘!',false)}
function add(value,mine){const b=document.createElement('div');b.className='bubble'+(mine?' mine':'');b.textContent=value;document.getElementById('thread').appendChild(b);b.scrollIntoView({block:'nearest',behavior:'smooth'})}
</script></body></html>
