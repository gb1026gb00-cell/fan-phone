<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#0a0b13"><title>WOoyoung's Phone · Fanmade</title><style>
:root{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;color:#fff}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 50% 15%,#242c48,#090b12 70%);display:grid;place-items:center;padding:20px}.phone{position:relative;width:min(390px,100%);height:min(820px,calc(100dvh - 32px));min-height:580px;border:7px solid #34353b;border-radius:48px;box-shadow:0 25px 90px #0009,inset 0 0 0 2px #666;overflow:hidden;background:#090a10}.screen{height:100%;position:relative;overflow:auto;scrollbar-width:none}.screen::-webkit-scrollbar{display:none}.wallpaper{background:radial-gradient(ellipse at 65% 38%,#62618f 0%,#303c70 25%,#141b3a 48%,#090c19 78%)}.island{position:absolute;z-index:15;top:10px;left:50%;transform:translateX(-50%);height:28px;width:112px;border-radius:18px;background:#050508}.status{position:absolute;top:14px;left:27px;right:26px;display:flex;justify-content:space-between;align-items:center;font-size:13px;font-weight:700;z-index:14}.status .symbols{letter-spacing:3px}.hidden{display:none!important}button{font:inherit;color:inherit;cursor:pointer}button:focus-visible,input:focus-visible{outline:2px solid #aab9ff;outline-offset:2px}.homebar{position:absolute;bottom:8px;left:50%;transform:translateX(-50%);width:125px;height:5px;border-radius:8px;background:#ffffffb0;z-index:16}.lock{height:100%;padding:75px 22px 42px;text-align:center;display:flex;flex-direction:column;align-items:center}.lock .date{font-size:17px;margin-top:14px}.clock{font-size:78px;letter-spacing:-5px;font-weight:200;line-height:1.1}.lock-bottom{margin-top:auto;width:100%}.lock-bottom p{font-size:13px;color:#d3d7e6}.pin{width:180px;max-width:100%;border:1px solid #ffffff5c;border-radius:14px;background:#ffffff19;padding:13px;text-align:center;font-size:24px;letter-spacing:9px;color:white}.unlock{display:block;width:180px;margin:10px auto;background:#ffffffd9;color:#151525;border:0;padding:12px;border-radius:14px;font-weight:700}.error{height:19px;color:#ffb2b2;font-size:12px}.hint{font-size:12px;color:#ffffffa8}.home{height:100%;padding:76px 20px 100px}.home-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}.home-head h1{font-size:24px;margin:0;font-weight:600}.home-head small{color:#ddd}.apps{display:grid;grid-template-columns:repeat(4,1fr);gap:25px 8px}.appicon{background:none;border:0;display:flex;flex-direction:column;align-items:center;gap:7px;font-size:11px}.tile{width:60px;height:60px;border-radius:15px;display:grid;place-items:center;font-size:28px;box-shadow:0 4px 10px #0004}.green{background:linear-gradient(135deg,#55d86d,#1b9b59)}.blue{background:linear-gradient(135deg,#56baff,#2876f6)}.grey{background:linear-gradient(135deg,#90929b,#494b58)}.orange{background:linear-gradient(135deg,#ffbb62,#ff7743)}.pink{background:linear-gradient(135deg,#fb91bd,#c54f89)}.purple{background:linear-gradient(135deg,#a3a0fb,#6359c9)}.dock{position:absolute;bottom:31px;left:16px;right:16px;background:#ffffff27;backdrop-filter:blur(20px);border-radius:25px;padding:14px;display:flex;justify-content:space-around}.dock .tile{width:56px;height:56px}.appview{height:100%;background:#0c0c11;padding:58px 18px 55px;overflow:auto}.topnav{display:flex;align-items:center;gap:10px;margin-bottom:18px}.back{background:none;border:0;color:#8aa9ff;padding:6px 2px;font-size:15px}.topnav h2{margin:0;font-size:22px}.sub{font-size:12px;color:#aaa}.listitem{width:100%;background:#1c1c24;border:0;border-radius:15px;padding:15px;text-align:left;margin:7px 0;display:flex;align-items:center;gap:12px}.avatar{width:46px;height:46px;display:grid;place-items:center;border-radius:50%;background:linear-gradient(145deg,#444d80,#9982a8);font-size:21px}.listitem strong{display:block}.listitem small{color:#aeb0c1}.chat{display:flex;flex-direction:column;height:calc(100% - 6px);padding-bottom:12px}.chatlog{flex:1;overflow:auto;display:flex;flex-direction:column;gap:10px;padding:12px 0}.bubble{max-width:83%;padding:11px 13px;border-radius:17px;background:#292a35;line-height:1.5;font-size:14px;align-self:flex-start;white-space:pre-wrap}.bubble.me{background:#3155a4;align-self:flex-end}.chatbox{display:flex;gap:8px;padding:10px 0}.chatbox input{min-width:0;flex:1;background:#24242d;border:1px solid #43444d;color:white;border-radius:25px;padding:12px}.send{background:#5078e8;border:0;border-radius:50%;width:42px;height:42px;font-size:19px}.note{background:#20202a;border-radius:14px;padding:17px;line-height:1.7;margin:12px 0;color:#e5e5eb}.note h3{margin:0 0 9px}.gallery{display:grid;grid-template-columns:repeat(3,1fr);gap:5px}.photo{border:0;aspect-ratio:1;background:linear-gradient(140deg,#25365b,#ac91b0);display:grid;place-items:center;font-size:33px}.photo:nth-child(2n){background:linear-gradient(130deg,#66556c,#e1a986)}.photo:nth-child(3n){background:linear-gradient(130deg,#1c5364,#5e8d87)}.photo-detail{font-size:15px;line-height:1.6}.notice{font-size:12px;color:#a8a8b6;line-height:1.5}.settings-row{padding:16px;border-bottom:1px solid #353540}.smallbtn{border:0;border-radius:12px;padding:12px 15px;background:#30334a}.footer-note{position:fixed;bottom:5px;font-size:11px;color:#c3c6d5;text-align:center} @media(max-height:650px){.clock{font-size:57px}.lock{padding-top:55px}.apps{gap:12px 5px}.tile{width:50px;height:50px}.home{padding-top:58px}}
</style></head><body><main class="phone"><div class="island"></div><div class="status"><span id="statustime">9:41</span><span class="symbols">▂▃▅ ◉ ▰</span></div><div class="screen wallpaper" id="screen"><section class="lock" id="lock"><div class="date" id="date">10월 23일 금요일</div><div class="clock" id="bigclock">09:41</div><div class="lock-bottom"><div style="font-size:28px">🔒</div><p>정우영의 iPhone</p><input id="pin" class="pin" type="password" inputmode="numeric" maxlength="4" placeholder="••••" aria-label="비밀번호 네 자리"><button class="unlock" id="unlock">잠금 해제</button><div class="error" id="error"></div><div class="hint">체험 비밀번호: 1234</div></div></section><section class="home hidden" id="home"><div class="home-head"><div><small>Friday, October 23</small><h1>우영의 iPhone</h1></div><span style="font-size:28px">☾</span></div><div class="apps" id="apps"></div><div class="dock" id="dock"></div></section><section class="appview hidden" id="appview"></section></div><div class="homebar" id="homebar" title="홈으로 돌아가기"></div></main><div class="footer-note">비공식 팬메이드 · 실제 인물의 메시지가 아닌 창작 콘텐츠</div><script>
const $=id=>document.getElementById(id);let current='lock';const apps=[['메시지','💬','green','messages'],['사진','🌄','blue','photos'],['메모','📝','orange','notes'],['전화','📞','green','calls'],['설정','⚙️','grey','settings'],['AI 채팅','✦','purple','ai']];const chats=[{who:'정우영',body:'뭐해? ㅋㅋㅋ\n나 오늘 진짜 웃긴 일 있었어',mine:false},{who:'나',body:'뭔데??',mine:true},{who:'정우영',body:'아니 그건 만나서 얘기해 줄게 😆',mine:false}];function clock(){const d=new Date();const t=d.toLocaleTimeString('ko-KR',{hour:'2-digit',minute:'2-digit',hour12:false});$('statustime').textContent=t;$('bigclock').textContent=t;$('date').textContent=d.toLocaleDateString('ko-KR',{month:'long',day:'numeric',weekday:'long'});}clock();setInterval(clock,30000);
function show(which){current=which;$('lock').classList.toggle('hidden',which!=='lock');$('home').classList.toggle('hidden',which!=='home');$('appview').classList.toggle('hidden',which==='lock'||which==='home');$('screen').classList.toggle('wallpaper',which==='lock'||which==='home');}function unlock(){if($('pin').value==='1234'){show('home');$('error').textContent='';}else{$('error').textContent='비밀번호가 달라요. 다시 입력해 주세요.';$('pin').value='';}}$('unlock').onclick=unlock;$('pin').addEventListener('keydown',e=>{if(e.key==='Enter')unlock()});$('homebar').onclick=()=>show('home');
function renderHome(){const item=a=>`<button class="appicon" data-app="${a[3]}"><span class="tile ${a[2]}">${a[1]}</span><span>${a[0]}</span></button>`;$('apps').innerHTML=apps.map(item).join('');$('dock').innerHTML=[apps[3],apps[0],apps[1],apps[2]].map(item).join('');document.querySelectorAll('[data-app]').forEach(b=>b.onclick=()=>openApp(b.dataset.app));}renderHome();
function shell(title,body){$('appview').innerHTML=`<div class="topnav"><button class="back" id="back">‹ 홈</button><h2>${title}</h2></div>${body}`;$('back').onclick=()=>show('home');show('app');}function openApp(app){if(app==='messages'){shell('메시지',`<button class="listitem" id="chatentry"><span class="avatar">🐱</span><span><strong>정우영</strong><small>아니 그건 만나서 얘기해 줄게 😆</small></span></button><p class="notice">이 대화는 팬픽용으로 작성한 가상의 메시지입니다.</p>`);$('chatentry').onclick=renderChat;}else if(app==='photos'){shell('사진',`<p class="sub">최근 항목 · 6장</p><div class="gallery">${['🌙','☕','🌊','🎧','🌇','🐈'].map((x,i)=>`<button class="photo" data-photo="${i}">${x}</button>`).join('')}</div><p class="notice">현재는 사진 대신 예시 이미지 아이콘이 들어 있어요. 나중에 원하는 사진으로 교체할 수 있습니다.</p>`);document.querySelectorAll('[data-photo]').forEach(b=>b.onclick=()=>shell('사진 보기',`<div style="text-align:center;font-size:110px;padding:70px 0">${['🌙','☕','🌊','🎧','🌇','🐈'][Number(b.dataset.photo)]}</div><p class="photo-detail">우영의 사진첩 · 팬메이드 샘플</p><button class="smallbtn" id="goback">사진첩으로 돌아가기</button>`));document.querySelectorAll('[data-photo]').forEach(b=>b.addEventListener('click',()=>{$('goback').onclick=()=>openApp('photos')}));}else if(app==='notes'){shell('메모',`<div class="note"><h3>오늘의 할 일</h3>□ 커피 사기<br>□ 산이한테 연락하기<br>□ 저녁 메뉴 정하기</div><div class="note"><h3>잊지 말 것</h3>별거 아닌 하루도 나중에는 이야기가 된다.</div>`);}else if(app==='calls'){shell('최근 통화',`<div class="listitem"><span class="avatar">📞</span><span><strong>정우영</strong><small>어제 · 오후 9:41 · 수신 통화</small></span></div><p class="notice">실제 전화 연결은 되지 않는 스토리용 화면입니다.</p>`);}else if(app==='settings'){shell('설정',`<div class="settings-row">📱 기기 이름 <strong style="float:right">우영의 iPhone</strong></div><div class="settings-row">🌙 화면 모드 <strong style="float:right">다크</strong></div><div class="settings-row">🔒 체험용 비밀번호 <strong style="float:right">1234</strong></div><div class="settings-row">💜 제작 방식 <strong style="float:right">팬메이드</strong></div><p class="notice">잠금 화면은 연출용입니다. 이 웹사이트에는 실제 보안 인증이 없습니다.</p><button class="smallbtn" id="lockagain">화면 잠그기</button>`);$('lockagain').onclick=()=>{$('pin').value='';show('lock')}}else if(app==='ai'){shell('AI 채팅',`<div class="note"><h3>✦ AI 채팅 준비 중</h3>현재 버전은 미리 정해진 자동 답장만 지원해요. 다음 단계에서 안전한 서버와 AI API를 연결하면 자유로운 대화가 가능해집니다.</div><button class="smallbtn" id="gochat">자동 답장 체험하기</button>`);$('gochat').onclick=renderChat;}}
function renderChat(){shell('정우영',`<div class="chat"><div class="sub">온라인 · 팬메이드 가상 대화</div><div class="chatlog" id="chatlog"></div><form class="chatbox" id="chatform"><input id="message" placeholder="메시지 보내기" autocomplete="off" maxlength="300" aria-label="메시지"><button class="send" aria-label="전송">↑</button></form></div>`);const log=$('chatlog');chats.forEach(c=>{const b=document.createElement('div');b.className='bubble'+(c.mine?' me':'');b.textContent=c.body;log.append(b)});log.scrollTop=log.scrollHeight;$('chatform').onsubmit=e=>{e.preventDefault();const inp=$('message'),v=inp.value.trim();if(!v)return;chats.push({who:'나',body:v,mine:true});inp.value='';const replies=['ㅋㅋㅋㅋ 진짜?','아니 그래서 어떻게 됐는데?','나도 그 생각 했어 😆','잠깐만 나 지금 웃고 있어 ㅋㅋ','오늘은 뭐 하고 놀까?'];chats.push({who:'정우영',body:replies[(chats.length/2|0)%replies.length],mine:false});renderChat();};}
</script></body></html>
